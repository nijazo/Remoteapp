<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Aanmeldscherm</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#ffffff}a:hover{color:#dbe4f0}
.hovw:hover{background:rgba(255,255,255,0.16) !important}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #d9e7f2; font-family: Inter, system-ui, sans-serif; color: #ffffff">

<svg aria-hidden="true" width="1440" height="900" viewBox="0 0 1440 900" style="position: absolute; left: 0; top: 0">
<circle cx="1130" cy="220" r="78" fill="#f4cf9c"></circle>
<path d="M0 520 C 180 440, 360 470, 520 430 C 700 385, 860 450, 1040 410 C 1200 375, 1330 420, 1440 395 L1440 900 L0 900 Z" fill="#a9c6dd"></path>
<path d="M0 610 C 200 540, 380 600, 600 560 C 820 520, 980 600, 1180 560 C 1300 535, 1380 560, 1440 550 L1440 900 L0 900 Z" fill="#7aa3c8"></path>
<path d="M0 700 C 240 640, 460 710, 720 670 C 960 635, 1180 700, 1440 650 L1440 900 L0 900 Z" fill="#4d7aa6"></path>
<path d="M0 790 C 300 750, 560 800, 860 770 C 1100 748, 1300 780, 1440 760 L1440 900 L0 900 Z" fill="#2f5682"></path>
</svg>
<div style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px; background: rgba(12,22,40,0.6)"></div>

<div style="position: absolute; left: 0; top: 64px; width: 1440px; display: flex; flex-direction: column; align-items: center; gap: 4px">
<span style="font-size: 72px; font-weight: 300; line-height: 1; letter-spacing: -0.02em">15:48</span>
<span style="font-size: 18px; font-weight: 500">zondag 15 november</span>
</div>

<div style="position: absolute; left: 0; top: 280px; width: 1440px; display: flex; flex-direction: column; align-items: center; gap: 14px">
<span style="width: 112px; height: 112px; border-radius: 50%; background: {{cur.color}}; border: 3px solid rgba(255,255,255,0.85); box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 600">{{cur.initial}}</span>
<span style="font-size: 26px; font-weight: 700">{{cur.name}}</span>
<span style="font-size: 14px; color: #e3e9f2; margin-top: -8px">{{cur.type}}</span>

<sc-if value="{{cur.guest}}" hint-placeholder-val="{{ false }}">
<button type="button" style="margin-top: 8px; height: 44px; padding: 0 24px; border: 0; border-radius: 10px; background: {{accent}}; color: #ffffff; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Aanmelden als gast</button>
<span style="font-size: 13px; color: #e3e9f2">Alles wordt gewist zodra je afmeldt.</span>
</sc-if>

<sc-if value="{{cur.notGuest}}" hint-placeholder-val="{{ true }}">
<sc-if value="{{showInput}}" hint-placeholder-val="{{ true }}">
<div style="margin-top: 8px; display: flex; align-items: center; width: 340px; height: 46px; border-radius: 10px; background: #ffffff; overflow: hidden">
<label style="flex: 1; display: flex; align-items: center; height: 100%; padding: 0 14px">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{placeholder}} van {{cur.name}}</span>
<input type="password" placeholder="{{placeholder}}" style="border: 0; outline: none; background: transparent; font: inherit; font-size: 15px; color: #13243b; width: 100%">
</label>
<button type="button" aria-label="Wachtwoord tonen" style="width: 40px; height: 100%; border: 0; background: transparent; color: #3d4b61; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
<button type="button" aria-label="Aanmelden" style="width: 46px; height: 100%; border: 0; background: {{accent}}; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
</sc-if>
<sc-if value="{{showMessage}}" hint-placeholder-val="{{ false }}">
<div style="margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 10px; width: 340px; height: 46px; border-radius: 10px; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.35); box-sizing: border-box; font-size: 14px; font-weight: 500">{{message}}</div>
</sc-if>

<a href="#" style="font-size: 13.5px; font-weight: 500; color: #ffffff">Wachtwoord vergeten?</a>

<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 6px">
<span style="font-size: 13px; color: #e3e9f2">Aanmeldopties</span>
<div role="group" aria-label="Aanmeldopties" style="display: flex; gap: 8px">
<sc-for list="{{methods}}" as="mt" hint-placeholder-count="4">
<button type="button" class="hovw" onClick="{{mt.pick}}" aria-pressed="{{mt.selected}}" aria-label="{{mt.label}}" title="{{mt.label}}" style="width: 48px; height: 48px; border: 2px solid {{mt.border}}; border-radius: 10px; background: {{mt.bg}}; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{mt.icon}}"></path></svg></button>
</sc-for>
</div>
</div>
</sc-if>
</div>

<div style="position: absolute; left: 32px; bottom: 32px; display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{users}}" as="u" hint-placeholder-count="4">
<button type="button" class="hovw" onClick="{{u.pick}}" aria-pressed="{{u.selected}}" style="display: flex; align-items: center; gap: 12px; width: 260px; height: 56px; padding: 0 12px; border: 0; border-radius: 10px; background: {{u.bg}}; color: #ffffff; font: inherit; text-align: left; cursor: pointer">
<span style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 50%; background: {{u.color}}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">{{u.initial}}</span>
<span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14.5px; font-weight: 600">{{u.name}}</span><span style="font-size: 12px; color: #e3e9f2">{{u.type}}</span></span>
</button>
</sc-for>
</div>

<div style="position: absolute; right: 32px; bottom: 32px; display: flex; align-items: center; gap: 8px">
<button type="button" class="hovw" aria-label="Taal en toetsenbord: Nederlands" style="height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: #ffffff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">NL</button>
<button type="button" class="hovw" aria-label="Toegankelijkheid" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="1.5"></circle><path d="M5 8l7 1.5L19 8M12 9.5V14l-3 6M12 14l3 6"></path></svg></button>
<button type="button" class="hovw" aria-label="Wifi: verbonden" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01"></path></svg></button>
<button type="button" class="hovw" aria-label="Batterij: 64 procent" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="18" height="10" rx="2"></rect><path d="M22 11v2"></path><rect x="5" y="10" width="7.5" height="4" rx="0.5" fill="currentColor" stroke="none"></rect></svg></button>
<button type="button" class="hovw" aria-label="Aan/uit" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9M7 6.3a7 7 0 1 0 10 0"></path></svg></button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2563c9","options":["#2563c9","#b8501a","#137a6f","#6d45b8"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { user: 'gebruiker', method: 'wachtwoord' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#2563c9';
    const list = [
      { id: 'gebruiker', name: 'Gebruiker', type: 'Lokaal account · Beheerder', color: accent },
      { id: 'sam', name: 'Sam', type: 'Lokaal account · Standaardgebruiker', color: '#0f766e' },
      { id: 'kinderen', name: 'Kinderen', type: 'Lokaal account · Kind (ouderlijk toezicht)', color: '#b8501a' },
      { id: 'gast', name: 'Gast', type: 'Tijdelijk account', color: '#4b5a70' }
    ];
    const curRaw = list.find((u) => u.id === this.state.user) || list[0];
    const isGuest = curRaw.id === 'gast';
    const cur = { name: curRaw.name, type: curRaw.type, color: curRaw.color, initial: curRaw.name.charAt(0), guest: isGuest, notGuest: !isGuest };
    const users = list.map((u) => {
      const sel = u.id === this.state.user;
      return {
        name: u.name, type: u.type.replace('Lokaal account · ', ''), color: u.color, initial: u.name.charAt(0), selected: sel,
        bg: sel ? 'rgba(255,255,255,0.2)' : 'transparent',
        pick: () => this.setState({ user: u.id })
      };
    });
    const mdefs = [
      { id: 'wachtwoord', label: 'Wachtwoord', icon: 'M4 7h16a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1zM7 12h.01M10.5 12h.01M14 12h.01M17 12h.01' },
      { id: 'pincode', label: 'Pincode', icon: 'M6 5h.01M12 5h.01M18 5h.01M6 11h.01M12 11h.01M18 11h.01M6 17h.01M12 17h.01M18 17h.01M12 21h.01' },
      { id: 'vinger', label: 'Vingerafdruk', icon: 'M12 11v4M8.5 9.5a4 4 0 0 1 7 2.5v2a8 8 0 0 1-1 4M6 13a6 6 0 0 1 10.5-5M5 17a9 9 0 0 0 1-4M9 21a10 10 0 0 0 2-5M15.5 21a14 14 0 0 0 .5-3M19 16a14 14 0 0 0 0-4' },
      { id: 'sleutel', label: 'Beveiligingssleutel', icon: 'M7.5 14a3.5 3.5 0 1 0 0-7a3.5 3.5 0 0 0 0 7zM10.5 10.5H21M18 10.5V14M15 10.5V13' }
    ];
    const methods = mdefs.map((d) => {
      const sel = d.id === this.state.method;
      return {
        label: d.label, icon: d.icon, selected: sel,
        border: sel ? '#ffffff' : 'rgba(255,255,255,0.35)', bg: sel ? 'rgba(255,255,255,0.2)' : 'transparent',
        pick: () => this.setState({ method: d.id })
      };
    });
    const msg = { vinger: 'Leg je vinger op de scanner', sleutel: 'Steek je beveiligingssleutel in en raak hem aan' };
    const isInput = this.state.method === 'wachtwoord' || this.state.method === 'pincode';
    return {
      accent: accent,
      cur: cur,
      users: users,
      methods: methods,
      showInput: isInput,
      showMessage: !isInput,
      placeholder: this.state.method === 'pincode' ? 'Pincode' : 'Wachtwoord',
      message: msg[this.state.method] || ''
    };
  }
}
</script>
</body>
</html>
