<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Accounts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2563c9}a:hover{color:#1d4ea3}
.hov:hover{background:rgba(37,99,201,0.09) !important}
.hovd:hover{background:rgba(255,255,255,0.14) !important}
.nv{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border:0;border-radius:8px;background:transparent;font:inherit;font-size:13.5px;color:#13243b;text-align:left;cursor:pointer}
.b2{height:38px;padding:0 14px;border:1px solid #c9d2de;border-radius:9px;background:#ffffff;font:inherit;font-size:13px;font-weight:600;color:#13243b;cursor:pointer;white-space:nowrap;flex-shrink:0}
.acc{display:grid;grid-template-columns:36px minmax(0,1fr) auto 16px;align-items:center;gap:14px;width:100%;box-sizing:border-box;height:56px;padding:0 10px;border:0;border-bottom:1px solid #eef1f5;border-radius:0;background:transparent;font:inherit;color:#13243b;text-align:left;cursor:pointer}
</style>
<title>{{t.docTitle}}</title>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #d9e7f2; font-family: Inter, system-ui, sans-serif; color: #13243b">

<svg aria-hidden="true" width="1440" height="900" viewBox="0 0 1440 900" style="position: absolute; left: 0; top: 0">
<circle cx="1130" cy="220" r="78" fill="#f4cf9c"></circle>
<path d="M0 520 C 180 440, 360 470, 520 430 C 700 385, 860 450, 1040 410 C 1200 375, 1330 420, 1440 395 L1440 900 L0 900 Z" fill="#a9c6dd"></path>
<path d="M0 610 C 200 540, 380 600, 600 560 C 820 520, 980 600, 1180 560 C 1300 535, 1380 560, 1440 550 L1440 900 L0 900 Z" fill="#7aa3c8"></path>
<path d="M0 700 C 240 640, 460 710, 720 670 C 960 635, 1180 700, 1440 650 L1440 900 L0 900 Z" fill="#4d7aa6"></path>
<path d="M0 790 C 300 750, 560 800, 860 770 C 1100 748, 1300 780, 1440 760 L1440 900 L0 900 Z" fill="#2f5682"></path>
</svg>

<div role="region" aria-label="{{t.taskTitle}}" style="position: absolute; left: 140px; top: 22px; width: 1160px; height: 822px; background: #ffffff; border-radius: 10px; box-shadow: 0 18px 48px rgba(10,20,40,0.28); overflow: hidden; display: flex; flex-direction: column">
<div style="height: 40px; flex-shrink: 0; background: #eef2f7; display: flex; align-items: center; justify-content: space-between; padding-left: 14px; border-bottom: 1px solid #dde3ec">
<div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3d4b61" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"></path></svg>
<span>{{t.settings}}</span>
</div>
<div style="display: flex; height: 100%">
<button class="hov" type="button" aria-label="{{t.minimize}}" style="width: 44px; height: 100%; border: 0; background: transparent; color: #3d4b61; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"></path></svg></button>
<button class="hov" type="button" aria-label="{{t.maximize}}" style="width: 44px; height: 100%; border: 0; background: transparent; color: #3d4b61; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="14" height="14" rx="1"></rect></svg></button>
<button class="hov" type="button" aria-label="{{t.close}}" style="width: 44px; height: 100%; border: 0; background: transparent; color: #3d4b61; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>
</div>

<div style="flex: 1; display: flex; min-height: 0">
<nav aria-label="{{t.settings}}" style="width: 250px; flex-shrink: 0; background: #f6f8fb; border-right: 1px solid #e6ebf2; padding: 16px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px">
<span aria-hidden="true" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; background: {{accent}}; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">{{t.initial}}</span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 14px; font-weight: 600">{{t.userName}}</span><span style="font-size: 12px; color: #4a5568">{{t.userRole}}</span></span>
</div>
<label style="height: 36px; border: 1px solid #d5dce6; border-radius: 8px; background: #ffffff; display: flex; align-items: center; gap: 8px; padding: 0 10px; margin-bottom: 10px; color: #4a5568">
<svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{t.searchLabel}}</span>
<input type="search" placeholder="{{t.searchPlaceholder}}" style="border: 0; outline: none; background: transparent; font: inherit; font-size: 13px; color: #13243b; width: 100%">
</label>
<button class="nv hov" type="button"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#3d4b61" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg>{{t.navSystem}}</button>
<button class="nv hov" type="button"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#3d4b61" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01"></path></svg>{{t.navNetwork}}</button>
<button class="nv hov" type="button"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#3d4b61" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>{{t.navPrivacy}}</button>
<button class="nv hov" type="button"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#3d4b61" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1"></rect><rect x="14" y="4" width="6" height="6" rx="1"></rect><rect x="4" y="14" width="6" height="6" rx="1"></rect><rect x="14" y="14" width="6" height="6" rx="1"></rect></svg>{{t.navApps}}</button>
<button class="nv" type="button" aria-current="page" style="background: {{accentSoft}}; font-weight: 600"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>{{t.navAccounts}}</button>
<button class="nv hov" type="button"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#3d4b61" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path></svg>{{t.navSecurity}}</button>
<button class="nv hov" type="button"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#3d4b61" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.6-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.6 4.5L20 16M20 20v-4h-4"></path></svg>{{t.navRecovery}}</button>
<button class="nv hov" type="button"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#3d4b61" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>{{t.navAbout}}</button>
</nav>

<main style="flex: 1; min-width: 0; padding: 26px 36px; display: flex; flex-direction: column; gap: 18px">
<h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em">{{t.pageTitle}}</h1>

<!-- Profile -->
<section aria-label="{{t.profileLabel}}" style="display: flex; align-items: center; gap: 18px; padding: 18px 20px; border: 1px solid #e1e6ee; border-radius: 12px">
<span aria-hidden="true" style="width: 60px; height: 60px; flex-shrink: 0; border-radius: 50%; background: {{accent}}; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700">{{t.initial}}</span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">{{t.userName}}</h2>
<p style="margin: 0; font-size: 13.5px; color: #3d4b61">{{t.profileRole}}</p>
</div>
<div style="display: flex; gap: 8px; flex-shrink: 0">
<button class="b2 hov" type="button">{{t.editProfile}}</button>
<button class="b2 hov" type="button">{{t.changePassword}}</button>
</div>
</section>

<!-- Work or school -->
<section style="display: flex; flex-direction: column; gap: 12px; padding: 18px 20px; border: 1px solid #e1e6ee; border-radius: 12px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">{{t.workTitle}}</h2>
<div style="display: flex; align-items: center; gap: 16px">
<span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; background: {{accentSoft}}; color: {{accent}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"></path><path d="M16 9h2a2 2 0 0 1 2 2v10M2 21h20M8 7h4M8 11h4M8 15h4"></path></svg></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 8px">
<span aria-hidden="true" style="width: 8px; height: 8px; flex-shrink: 0; border-radius: 50%; background: #22a35a"></span>
<h3 style="margin: 0; font-size: 15px; font-weight: 700">{{t.adTitle}}</h3>
</div>
<p style="margin: 0; font-size: 13px; line-height: 1.45; color: #3d4b61">{{t.adSub}}</p>
</div>
<button class="b2 hov" type="button" aria-label="{{t.manageLabel}}">{{t.manage}}</button>
</div>
<div style="display: flex; align-items: center; gap: 10px; margin-left: 60px; padding-top: 10px; border-top: 1px solid #eef1f5">
<svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#3d4b61" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M7 18h10a4 4 0 0 0 .6-8A6 6 0 0 0 6.2 9.2 4.5 4.5 0 0 0 7 18z"></path></svg>
<span style="flex: 1; min-width: 0; font-size: 13px; color: #3d4b61">{{t.entra}}</span>
<button class="hov" type="button" aria-label="{{t.connectLabel}}" style="height: 32px; padding: 0 12px; margin-right: -12px; border: 0; border-radius: 8px; background: transparent; font: inherit; font-size: 13px; font-weight: 600; color: {{accent}}; cursor: pointer; white-space: nowrap">{{t.connect}}</button>
</div>
</section>

<!-- Email, calendar and contacts -->
<section style="display: flex; flex-direction: column; gap: 6px; padding: 18px 20px 10px; border: 1px solid #e1e6ee; border-radius: 12px">
<h2 style="margin: 0 0 2px; font-size: 16px; font-weight: 700">{{t.mailTitle}}</h2>
<div role="list" aria-label="{{t.listLabel}}" style="display: flex; flex-direction: column; margin: 0 -10px">
<sc-for list="{{accounts}}" as="a">
<div role="listitem">
<button class="acc hov" type="button">
<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 50%; background: {{a.color}}; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">{{a.letter}}</span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 14px; font-weight: 600">{{a.name}}</span>
<span style="font-size: 12.5px; color: #3d4b61; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{a.email}}</span>
</span>
<span style="font-size: 12.5px; color: #4a5568; white-space: nowrap">{{a.services}}</span>
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5b6678" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>
</button>
</div>
</sc-for>
<div role="listitem">
<button class="acc hov" type="button" style="border-bottom: 0; grid-template-columns: 36px minmax(0,1fr)">
<span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; border: 1px dashed {{accent}}; color: {{accent}}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 14px; font-weight: 600; color: {{accent}}">{{t.addAccount}}</span>
<span style="font-size: 12.5px; color: #4a5568">{{t.addSub}}</span>
</span>
</button>
</div>
</div>
</section>

<div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 10px; background: {{accentSoft}}; font-size: 13px; color: #13243b">
<svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path><rect x="9.25" y="11" width="5.5" height="4.5" rx="1"></rect><path d="M10.5 11V9.5a1.5 1.5 0 0 1 3 0V11"></path></svg>
<span>{{t.privacy}}</span>
</div>
</main>
</div>
</div>

<div style="position: absolute; left: 0; bottom: 0; width: 1440px; height: 48px; background: #1a2232; display: flex; align-items: center; gap: 4px; padding: 0 6px; box-sizing: border-box; color: #ffffff">
<button type="button" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px 0 12px; border: 0; border-radius: 8px; background: {{accent}}; color: #ffffff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 64 64"><circle cx="32" cy="32" r="21" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-dasharray="99 33" transform="rotate(-30 32 32)"></circle><circle cx="37.4" cy="11.7" r="7" fill="#F5A524"></circle></svg><span>{{t.start}}</span></button>
<span style="width: 1px; height: 24px; background: #3a4558; margin: 0 6px"></span>
<button class="hovd" type="button" aria-label="{{t.explorer}}" style="width: 40px; height: 40px; border: 0; border-radius: 8px; background: transparent; color: #f2c46d; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></button>
<button class="hovd" type="button" aria-label="{{t.internet}}" style="width: 40px; height: 40px; border: 0; border-radius: 8px; background: transparent; color: #8fb8ff; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"></path></svg></button>
<button class="hovd" type="button" aria-label="{{t.email}}" style="width: 40px; height: 40px; border: 0; border-radius: 8px; background: transparent; color: #6fd6c9; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg></button>
<button class="hovd" type="button" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; margin-left: 6px; border: 0; border-bottom: 3px solid {{accent}}; border-radius: 8px 8px 4px 4px; background: rgba(255,255,255,0.08); color: #ffffff; font: inherit; font-size: 13px; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c5cfdd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"></path></svg>{{t.taskTitle}}</button>
<span style="flex: 1"></span>
<button class="hovd" type="button" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border: 0; border-radius: 16px; background: rgba(255,255,255,0.1); color: #ffffff; font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer"><span style="width: 8px; height: 8px; border-radius: 50%; background: #3ddc84"></span>{{t.services}}</button>
<button class="hovd" type="button" aria-label="{{t.wifi}}" style="width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01"></path></svg></button>
<button class="hovd" type="button" aria-label="{{t.volume}}" style="width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"></path></svg></button>
<button class="hovd" type="button" aria-label="{{t.battery}}" style="width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="18" height="10" rx="2"></rect><path d="M22 11v2"></path><rect x="5" y="10" width="9" height="4" rx="0.5" fill="currentColor" stroke="none"></rect></svg></button>
<div style="display: flex; flex-direction: column; align-items: flex-end; padding: 0 10px 0 8px; line-height: 1.25">
<span style="font-size: 13px; font-weight: 600">10:42</span>
<span style="font-size: 11.5px; color: #c5cfdd">{{t.date}}</span>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2563c9","options":["#2563c9","#b8501a","#137a6f","#6d45b8"]},"lang":{"editor":"select","default":"nl","options":["en","nl"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#2563c9';
    const m = /^#?([0-9a-f]{6})$/i.exec(accent);
    let soft = 'rgba(37,99,201,0.12)';
    if (m) {
      const n = parseInt(m[1], 16);
      soft = 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',0.12)';
    }
    const lang = this.props.lang === 'nl' ? 'nl' : 'en';
    const T = {
      en: {
        docTitle: 'Accounts', settings: 'Settings', minimize: 'Minimize', maximize: 'Maximize', close: 'Close',
        initial: 'S', userName: 'Sanne de Vries', userRole: 'Administrator', searchLabel: 'Search settings', searchPlaceholder: 'Find a setting',
        navSystem: 'System', navNetwork: 'Network & internet', navPrivacy: 'Privacy', navApps: 'Apps', navAccounts: 'Accounts',
        navSecurity: 'Security', navRecovery: 'Recovery & encryption', navAbout: 'About this system',
        pageTitle: 'Accounts', profileLabel: 'Your profile', profileRole: 'Administrator · Local account', editProfile: 'Edit profile', changePassword: 'Change password',
        workTitle: 'Work or school', adTitle: 'Connected to Active Directory',
        adSub: 'company.local · signed in as s.devries · group policies applied · synced 2 min ago',
        manage: 'Manage', manageLabel: 'Manage work or school account', entra: 'Microsoft Entra ID', connect: 'Connect', connectLabel: 'Connect Microsoft Entra ID',
        mailTitle: 'Email, calendar and contacts', listLabel: 'Linked accounts',
